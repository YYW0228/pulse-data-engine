[project]
name = "pulse-data-engine"
version = "0.1.0"
description = "独立数据引擎 — ODS/DWD/DWS + SCD Type 2 + DLQ + Parquet"
requires-python = ">=3.10"
dependencies = [
    "browserforge>=1.2.4",
    "curl-cffi>=0.15.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "playwright",
    "pydantic>=2.13.4",
    "scrapling[full]>=0.4.12",
]

[dependency-groups]
dev = [
    "dagster>=1.10.0",
    "mypy>=2.3.0",
    "prometheus-client>=0.21.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "streamlit>=1.42.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# BLE001: 全局捕获 Exception 在 LLM 降级/网络重试/外部回调等场景是故意设计
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"scripts/*" = ["BLE001"]
"pulse/runner.py" = ["S110"]
"pulse/assets.py" = ["S110"]

[tool.pytest.ini_options]
addopts = "--cov=pulse --cov-report=term-missing --cov-fail-under=50 -v"

[tool.coverage.run]
source = ["pulse"]
omit = [
    "tests/*", "scripts/*", "serve.py",
    "pulse/runner.py", "pulse/wasm_server.py", "pulse/extractors/*",
    "pulse/fetcher.py", "pulse/logging_config.py", "pulse/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# DuckDB fetchone() → Tuple | None 是 API 设计问题, 不阻塞 gate
# 同时抑制 httpx 类型推断、Pydantic validator 返回值等非关键问题
disable_error_code = "index,type-arg,no-untyped-call,misc,arg-type,no-any-return,return-value,attr-defined,no-untyped-def,assignment"
exclude = "pulse/wasm_server\\.py|pulse/runner\\.py|serve\\.py"

[[tool.mypy.overrides]]
module = ["pulse.ai_extractor", "pulse.extractors.boss"]
ignore_missing_imports = true
