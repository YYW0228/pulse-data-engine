# Pulse Data Engine gitleaks 配置
# 目的: 消除 generic-api-key 对评分卡维度字典键的误报。
# scripts/devour_scorecard.py 中所有 "key" 均为纯数据结构键
# (phase0_summary ... verdict_filter), 非真实密钥。
# allowlist regex 匹配的是被检测文本 (Secret), 因此直接匹配这些键值。

title = "pulse-data-engine gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "False positives: dimension dict keys in scripts/devour_scorecard.py"
regexes = [
    '''(phase[0-9]_[a-z_]+|verdict_filter)''',
]
