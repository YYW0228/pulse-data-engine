name: CI Gate
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy pulse/ --strict
      - run: uv run pytest --cov=pulse --cov-fail-under=65 --cov-report=xml
        env:
          CF_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
