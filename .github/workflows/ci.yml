name: CI Gate
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 部分扫描需要 before^ 祖先提交, 浅克隆会导致
          # "fatal: ambiguous argument ... unknown revision" 失败
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy pulse/ --strict
      - run: uv run python -m pytest --cov=pulse --cov-fail-under=50 --cov-report=xml
        env:
          CF_ACCOUNT_ID: ""
          CLOUDFLARE_API_TOKEN: ""
          PYTHONPATH: ${{ github.workspace }}
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
