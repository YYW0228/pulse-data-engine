name: Daily Pipeline
on:
  schedule:
    # 每 6 小时: 02:00, 08:00, 14:00, 20:00 UTC
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "指定 run_id (留空自动生成)"
        required: false
        default: ""
      dev_mode:
        description: "开发模式 (跳过 R2 同步)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 运行生产管道
        id: run
        run: |
          OPTS=""
          if [ -n "${{ inputs.run_id }}" ]; then
            OPTS="$OPTS --run-id ${{ inputs.run_id }}"
          fi
          uv run python -m scripts.run_production $OPTS 2>&1 | tee pipeline_output.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: 解析运行结果
        id: parse
        run: |
          STATUS=$(python3 -c "import json; d=json.load(open('pipeline_output.json')); print(d.get('status','unknown'))")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Pipeline status: $STATUS"

      - name: Slack 通知 (失败)
        if: steps.parse.outputs.status == 'failed' || steps.parse.outputs.status == 'crashed'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "#ff0000",
                "title": "❌ Pulse Pipeline Failed",
                "text": "Run: ${{ steps.run.outputs.run_id || 'unknown' }}\nStatus: ${{ steps.parse.outputs.status }}\nView: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

      - name: Slack 通知 (成功)
        if: steps.parse.outputs.status == 'completed'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [{
                "color": "#36a64f",
                "title": "✅ Pulse Pipeline OK",
                "text": "Run completed successfully\nView: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }]
            }

      - name: 上传运行报告 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report-${{ github.run_id }}
          path: |
            pipeline_output.json
            data/logs/pulse.jsonl
          retention-days: 7
